<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradMusk" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2D382B" />
      <stop offset="65%" stop-color="#1B2219" />
      <stop offset="100%" stop-color="#0E130D" />
    </radialGradient>
    <linearGradient id="frostedGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#EDE9E3" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#D8D4CC" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="silverGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#D4C8B8" />
      <stop offset="80%" stop-color="#A89F91" />
      <stop offset="100%" stop-color="#EAE5DF" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bgGradMusk)" />
  <ellipse cx="300" cy="515" rx="135" ry="18" fill="#000000" opacity="0.5" filter="blur(8px)" />

  <g transform="translate(0, 10)">
    <!-- Tall Elegant Cylinder Bottle -->
    <rect x="220" y="220" width="160" height="260" rx="40" fill="url(#frostedGlass)" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Pearlescent Glow inside -->
    <ellipse cx="300" cy="350" rx="60" ry="100" fill="#FFFFFF" opacity="0.4" filter="blur(15px)" />

    <!-- Pure Silk White Label -->
    <rect x="240" y="290" width="120" height="120" rx="16" fill="#141B10" stroke="#DFDDD4" stroke-width="1.5" />
    <circle cx="300" cy="325" r="16" fill="#DFDDD4" opacity="0.15" />
    <text x="300" y="330" font-family="serif" font-size="14" fill="#FFFFFF" text-anchor="middle">AS</text>
    <text x="300" y="365" font-family="serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">WHITE MUSK</text>
    <text x="300" y="385" font-family="sans-serif" font-size="10" font-weight="bold" fill="#D4C8B8" text-anchor="middle">مسك الغزال النقي</text>

    <!-- Silver/Gold Neck & Spherical Crystal Stopper -->
    <rect x="275" y="180" width="50" height="40" rx="4" fill="url(#silverGold)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="300" cy="140" r="45" fill="url(#silverGold)" stroke="#FFFFFF" stroke-width="1.5" />
    <ellipse cx="285" cy="125" rx="14" ry="8" fill="#FFFFFF" opacity="0.7" />
  </g>

  <!-- Tag -->
  <g transform="translate(300, 65)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#141B10" stroke="#FFFFFF" stroke-width="1" />
    <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🕊️ مسك الغزال والحرير</text>
  </g>
</svg>
