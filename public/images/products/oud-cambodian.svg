<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2E3A24" />
      <stop offset="60%" stop-color="#1A2215" />
      <stop offset="100%" stop-color="#0E130B" />
    </radialGradient>
    
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC880" />
      <stop offset="35%" stop-color="#C5A059" />
      <stop offset="70%" stop-color="#8C6527" />
      <stop offset="100%" stop-color="#ECC880" />
    </linearGradient>

    <!-- Rich Dark Amber Oud Oil -->
    <linearGradient id="oudOil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A3E12" />
      <stop offset="40%" stop-color="#4E2308" />
      <stop offset="100%" stop-color="#2D1204" />
    </linearGradient>

    <!-- Crystal Bottle Reflection -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Pedestal Reflection Shadow -->
  <ellipse cx="300" cy="510" rx="140" ry="22" fill="#000000" opacity="0.6" filter="blur(8px)" />

  <!-- Tola Crystal Body (Octagonal faceted bottle) -->
  <g transform="translate(0, 10)">
    <!-- Base Glass Foot -->
    <rect x="230" y="470" width="140" height="15" rx="5" fill="#D4C8B8" opacity="0.4" />

    <!-- Main Amber Oil Chamber -->
    <path d="M 220 250 L 380 250 L 370 470 L 230 470 Z" fill="url(#oudOil)" />
    
    <!-- Heavy Crystal Outer Wall -->
    <path d="M 210 240 L 390 240 L 375 480 L 225 480 Z" fill="url(#glassGloss)" stroke="#ECC880" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Facet Lines -->
    <line x1="255" y1="240" x2="265" y2="480" stroke="#ffffff" stroke-width="1.5" opacity="0.35" />
    <line x1="345" y1="240" x2="335" y2="480" stroke="#000000" stroke-width="2" opacity="0.4" />
    <line x1="300" y1="240" x2="300" y2="480" stroke="#ECC880" stroke-width="1" opacity="0.3" />

    <!-- Royal Label Emblem on Bottle -->
    <rect x="250" y="320" width="100" height="90" rx="12" fill="#141B10" stroke="#C5A059" stroke-width="1.5" />
    <circle cx="300" cy="350" r="14" fill="#C5A059" opacity="0.2" />
    <path d="M 293 355 L 300 342 L 307 355 Z" fill="#ECC880" />
    <text x="300" y="380" font-family="serif" font-size="10" font-weight="bold" fill="#ECC880" text-anchor="middle" letter-spacing="1">DEHN OUD</text>
    <text x="300" y="396" font-family="sans-serif" font-size="9" font-weight="bold" fill="#DFDDD4" text-anchor="middle">معتق فاخر</text>

    <!-- Bottle Neck -->
    <rect x="270" y="195" width="60" height="45" fill="url(#goldCap)" rx="3" stroke="#8C6527" stroke-width="1" />
    
    <!-- Royal Dome Finial Cap -->
    <path d="M 260 195 C 260 145, 340 145, 340 195 Z" fill="url(#goldCap)" stroke="#ECC880" stroke-width="1.5" />
    <!-- Crown Crest on Top -->
    <circle cx="300" cy="130" r="10" fill="url(#goldCap)" stroke="#ECC880" stroke-width="1" />
    <circle cx="300" cy="130" r="4" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Luxury Badge Top -->
  <g transform="translate(300, 70)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#141B10" stroke="#ECC880" stroke-width="1" />
    <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ECC880" text-anchor="middle">👑 دهن عود كمبودي معتق</text>
  </g>
</svg>
