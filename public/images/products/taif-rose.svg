<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradRose" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#332426" />
      <stop offset="65%" stop-color="#1F1517" />
      <stop offset="100%" stop-color="#0E0809" />
    </radialGradient>
    <linearGradient id="roseLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C75267" />
      <stop offset="50%" stop-color="#8E2D40" />
      <stop offset="100%" stop-color="#4F1320" />
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD5CE" />
      <stop offset="40%" stop-color="#DDA19B" />
      <stop offset="80%" stop-color="#B26E67" />
      <stop offset="100%" stop-color="#F3C3BC" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bgGradRose)" />
  <ellipse cx="300" cy="515" rx="140" ry="18" fill="#000000" opacity="0.6" filter="blur(8px)" />

  <g transform="translate(0, 10)">
    <!-- Faceted Octagonal Crystal Flacon -->
    <polygon points="240,220 360,220 390,340 370,470 230,470 210,340" fill="url(#roseLiquid)" stroke="#FCD5CE" stroke-width="2" stroke-opacity="0.5" />
    
    <!-- Cut Glass Highlight Facets -->
    <line x1="300" y1="220" x2="300" y2="470" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" />
    <polygon points="240,220 300,220 300,470 230,470 210,340" fill="#FFFFFF" opacity="0.08" />

    <!-- Center Oval Rose Gold Medallion -->
    <ellipse cx="300" cy="350" rx="65" ry="50" fill="#1A1113" stroke="url(#roseGold)" stroke-width="2" />
    <text x="300" y="340" font-family="serif" font-size="11" font-weight="bold" fill="#FCD5CE" text-anchor="middle" letter-spacing="1">ROYAL TAIF</text>
    <text x="300" y="360" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ورد طائفي ملكي</text>
    <text x="300" y="375" font-family="serif" font-size="8" fill="#DDA19B" text-anchor="middle">EAU DE PARFUM</text>

    <!-- Rose Gold Fluted Cap -->
    <rect x="270" y="170" width="60" height="50" rx="6" fill="url(#roseGold)" stroke="#FCD5CE" stroke-width="1" />
    <ellipse cx="300" cy="170" rx="30" ry="8" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- Tag -->
  <g transform="translate(300, 65)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1A1113" stroke="#FCD5CE" stroke-width="1" />
    <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FCD5CE" text-anchor="middle">🌹 ورد طائفي وزعفران</text>
  </g>
</svg>
